<style>
*{box-sizing:border-box}
body{
  background-color:#0e0a0a;

/* CAIXA COM RENDA */
.lace-wrapper{
  width:100%;max-width:800px;background:#f4ead0;color:#1a1a1a;
  border:1px solid #4a1422;outline:1px solid #4a1422;outline-offset:5px;
  padding:50px 40px 30px;position:relative;
}
.lace-wrapper::before{content:'❦';position:absolute;top:10px;left:15px;color:#4a1422;font-size:22px}
.lace-wrapper::after{content:'❦';position:absolute;top:10px;right:15px;color:#4a1422;font-size:22px}
h1{font-family:Cinzel;text-align:center;letter-spacing:4px;margin:0}
.subtitulo{font-style:italic;text-align:center;margin-top:10px}
.menu{text-align:center;margin:20px 0;font-family:Cinzel;font-size:11px;letter-spacing:2px}
.menu a{color:#4a1422;text-decoration:none;margin:0 8px}
.poema{margin-top:30px;line-height:1.7;font-size:18px}
a.botao{font-family:Cinzel;font-size:11px;border:1px solid #4a1422;padding:8px 15px;text-decoration:none;color:#4a1422}
@keyframes cair{to{transform:translateY(105vh) rotate(360deg)}}
</style>
</head>
