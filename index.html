<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cemitério literário — arquivo vivo</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--vinho:#4a1422;--marrom:#1a0d0d;--bege:#f2e8c9;--preto:#0a0808;--line:#d6c6a3}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--preto);
  background-image:
    radial-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    radial-gradient(rgba(74,20,34,.6) 1px, transparent 1px);
  background-size: 32px 32px, 28px 28px;
  min-height:100vh;display:flex;justify-content:center;padding:40px 16px;
  font-family:'EB Garamond', serif;
}
/* papel principal */
.moldura{
  width:100%;max-width:820px;
  background:var(--bege) url('https://www.transparenttextures.com/patterns/old-paper.png');
  border:1px solid var(--line);
  padding:0;position:relative;overflow:hidden;
  box-shadow:0 0 0 1px var(--vinho),0 0 0 10px var(--bege),0 0 0 11px var(--vinho),0 30px 80px rgba(0,0,0,.7);
}
.moldura::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.18), transparent 20%, transparent 85%, rgba(0,0,0,.06));
  pointer-events:none;
}
/* topo estético */
.top-bar{
  display:flex;justify-content:space-between;
  font-family:Cinzel;font-size:9px;letter-spacing:3px;
  padding:14px 28px;border-bottom:1px solid var(--line);
  color:var(--vinho);opacity:.7;
}
.hero{padding:54px 48px 20px;text-align:center}
#titulo{
  font-family:'UnifrakturMaguntia', cursive;
  font-size:clamp(46px, 8.5vw, 78px);line-height:.85;color:var(--marrom);
  font-weight:400;letter-spacing:-1px;
}
.sub{
  font-style:italic;font-size:17px;max-width:400px;margin:18px auto 0;
  line-height:1.5;color:var(--marrom);opacity:.7;
}
.divisor{margin:30px 48px;height:1px;background:linear-gradient(90deg, transparent, var(--line), transparent);position:relative}
.divisor span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--bege);padding:0 14px;color:var(--vinho);font-size:14px}
/* seções */
.content{padding:10px 48px 36px}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:32px 0 14px;
}
.section-head h2{font-family:Cinzel;font-size:11px;letter-spacing:5px;color:var(--vinho)}
.section-head small{font-family:Cinzel;font-size:9px;opacity:.4;letter-spacing:2px}
.lista{border-top:1px solid var(--line)}
.item{
  display:grid;grid-template-columns:60px 1fr auto;
  align-items:center;gap:16px;
  padding:18px 0;border-bottom:1px dotted #c9b896;
  text-decoration:none;color:var(--marrom);
  transition:.35s cubic-bezier(.16,1,.3,1);
}
.item:hover{background:rgba(74,20,34,.04);padding-left:12px;padding-right:12px;margin:0 -12px}
.item .num{font-family:Cinzel;font-size:10px;opacity:.4}
.item .name{font-family:Cinzel;font-size:15px;letter-spacing:1px}
.item .hint{font-family:'EB Garamond';font-style:italic;font-size:14px;opacity:.5;transition:.3s}
.item:hover .hint{opacity:1;color:var(--vinho);transform:translateX(4px)}
.item.novo .name{font-weight:600}
.item.novo .dot{width:6px;height:6px;background:var(--vinho);border-radius:50%;display:inline-block;margin-left:8px;box-shadow:0 0 8px var(--vinho);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.footer{
  display:flex;justify-content:space-between;
  padding:18px 28px;border-top:1px solid var(--line);
  font-family:Cinzel;font-size:8px;letter-spacing:3px;opacity:.5;
}
/* entrada */
.reveal{opacity:0;transform:translateY(18px)}
.reveal.active{opacity:1;transform:translateY(0);transition:1s cubic-bezier(.16,1,.3,1)}
@media(max-width:640px){
  body{padding:12px}.hero{padding:36px 22px 10px}.content{padding:10px 22px 24px}
  .item{grid-template-columns:40px 1fr auto}.item .name{font-size:13px}
}
</style>
</head>
<body>
<main class="moldura reveal" id="papel">
  
  
  <div class="hero">
    <h1 id="titulo">cemitério literário</h1>
    <p class="sub">Uma tela grafada por binaridade onde se encontra a imprecisão humana.</p>
  </div>

  <div class="divisor"><span>♱</span></div>

  <div class="content">
    <div class="section-head"><h2>Textos</h2></div>
    <div class="lista">
      <a href="textos/neblina.html" class="item"><span class="num"></span><span class="name">neblina</span><span class="hint">ler →</span></a>
      <a href="textos/calculos.html" class="item"><span class="num"></span><span class="name">cálculos</span><span class="hint">ler →</span></a>
      <a href="textos/hidrofilia.html" class="item"><span class="num"></span><span class="name">hidrofilia</span><span class="hint">ler →</span></a>
    </div>

    <div class="section-head"><h2>Poemas</h2></div>
    <div class="lista">
      <a href="textos/beatrice.html" class="item"><span class="num"></span><span class="name">Beatrice</span><span class="hint">ler →</span></a>
      <a href="textos/a passarela.html" class="item"><span class="num"></span><span class="name">A passarela</span><span class="hint">ler →</span></a>
      <a href="textos/22.12.26.html" class="item"><span class="num"></span><span class="name">2212</span><span class="hint">ler →</span></a>
      <a href="textos/credo.html" class="item"><span class="num"></span><span class="name">Credo</span><span class="hint">ler →</span></a>
     
    </div>
  </div>

  <footer class="footer"><span>© CEMETERYART_</span></footer>
</main>

<script>
const papel=document.getElementById('papel');
const t=document.getElementById('titulo');
const txt=t.innerHTML;
new IntersectionObserver(e=>e.forEach(x=>x.isIntersecting&&x.target.classList.add('active')),{threshold:.1}).observe(papel);
if(innerWidth>640){
  t.innerHTML='';let i=0;
  (function w(){if(i<txt.length){t.innerHTML+=txt.charAt(i++);setTimeout(w,50+Math.random()*50)}})();
} else papel.classList.add('active');
</script>
</body>
</html>
